<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restock Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Work+Sans:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f4; --ink:#1c1a17; --ink-2:#5c574d; --muted:#78726a; --faint:#a09a8e;
    --rule:#e7e2d8; --field:#c9c2b4; --accent:#2f5d45; --accent-soft:#b9cdc2;
    --in:#2f7d4f; --res:#a97613; --out:#6f6a60; --out-dot:#c9c2b4; --check:#3a6ea5;
    --sans:'Work Sans',system-ui,-apple-system,sans-serif;
    --serif:'Libre Caslon Display',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14.5px;line-height:1.55;padding:44px 24px 64px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}

  /* ---- masthead ---- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding-bottom:22px;border-bottom:1px solid var(--ink)}
  h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:400;line-height:1;letter-spacing:-.01em}
  .sub{margin:20px 0 34px;font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:52ch;text-wrap:pretty}

  /* ---- buttons ---- */
  button{font-family:var(--sans);cursor:pointer}
  .primary{background:none;color:var(--ink);border:1px solid var(--ink);border-radius:2px;
    padding:10px 24px;font-size:13.5px;font-weight:500;letter-spacing:.02em}
  .primary:hover{background:var(--ink);color:var(--paper)}
  .primary:disabled{opacity:.35;cursor:default;background:none;color:var(--ink)}
  .underbtn{background:none;border:0;padding:0 0 2px;font-family:var(--mono);font-size:10px;
    font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid var(--accent-soft)}
  .underbtn:hover{border-bottom-color:var(--accent)}
  .underbtn:disabled{color:var(--muted);border-bottom-color:var(--rule);cursor:default}

  /* ---- add form ---- */
  form.add{display:flex;gap:14px;align-items:flex-end;margin:48px 0 14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:200px}
  .field.nick{flex:0 0 190px}
  .field > span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .field input{border:0;border-bottom:1px solid var(--field);background:none;
    padding:7px 2px;font-family:var(--sans);font-size:14.5px;color:var(--ink);outline:none;width:100%}
  .field input::placeholder{color:var(--faint)}
  .field input:focus{border-bottom-color:var(--accent)}

  #msg{min-height:18px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    color:var(--muted);margin:22px 0 16px}
  #msg:empty{margin:22px 0 16px}

  /* ---- list ---- */
  .listhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:12px;
    padding-bottom:9px;border-bottom:1px solid var(--ink);font-family:var(--mono);
    font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .listhead .count{color:var(--muted);text-align:right}
  .item{display:flex;gap:20px;align-items:center;padding:18px 0;
    border-bottom:1px solid var(--rule);position:relative}
  .thumb{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border:1px solid #ded9cf;
    background:repeating-linear-gradient(135deg,#efebe2 0 6px,#e6e1d6 6px 12px)}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .store{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint)}
  .name{font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--ink);
    text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .name:hover{color:var(--accent)}
  .meta{font-size:12px;color:var(--muted)}
  .status{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-left:8px;width:150px}
  .status-row{display:flex;align-items:center;gap:9px}
  .substatus{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);padding-left:16px;line-height:1.3}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;
    text-transform:uppercase;width:112px;line-height:1.35}
  .s-in .dot{background:var(--in)} .s-in .label{color:var(--in)}
  .s-res .dot{background:var(--res)} .s-res .label{color:var(--res)}
  .s-out .dot{background:var(--out-dot)} .s-out .label{color:var(--out)}
  .s-pending .dot{background:var(--field)} .s-pending .label{color:var(--muted)}
  .s-check .label{color:var(--check)}
  .spin{width:9px;height:9px;flex:0 0 9px;border:1.5px solid var(--check);
    border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .close{position:absolute;top:14px;right:0;background:none;border:0;padding:2px 4px;
    font-family:var(--sans);font-size:16px;line-height:1;color:var(--faint);opacity:0;transition:opacity .12s}
  .item:hover .close,.close:focus{opacity:1}
  .close:hover{color:var(--accent)}

  .empty{padding:44px 0;border-bottom:1px solid var(--rule);color:var(--muted);font-size:13.5px}
  .foot{margin:26px 0 0;font-size:11.5px;line-height:1.6;color:var(--faint);max-width:56ch}

  @media (max-width:640px){
    body{padding:32px 20px 56px;font-size:14px}
    h1{font-size:27px}
    header{align-items:center}
    form.add{gap:18px}
    .field,.field.nick{flex:1 1 100%}
    .primary{flex:1 1 100%;padding:13px 26px}
    .item{gap:14px;flex-wrap:wrap;padding:16px 0}
    .thumb{width:48px;height:48px;flex:0 0 48px}
    .info{flex:1 1 auto}
    .status{flex:1 1 100%;padding-left:0}
    .label{width:auto}
    .close{opacity:1;top:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Restock Monitor</h1>
  </header>

  <form class="add" id="addForm">
    <label class="field">
      <span>Product URL</span>
      <input type="url" id="url" placeholder="Paste a product URL…" required>
    </label>
    <label class="field nick">
      <span>Nickname</span>
      <input type="text" id="label" placeholder="Optional">
    </label>
    <button class="primary" type="submit" id="addBtn">Add</button>
  </form>

  <div id="msg"></div>

  <div class="listhead">
    <span>Watching</span>
    <button class="underbtn" id="checkBtn" type="button">Check all now</button>
    <span class="count" id="count"></span>
  </div>
  <div id="grid"></div>

  <p class="foot">The list reloads saved statuses on its own every minute. “Check all now” triggers a fresh live check on your Mac.</p>
</div>

<script>
const SUPABASE_URL = "https://wazcubfmmevaxzxfanee.supabase.co";
const KEY = "sb_publishable_xrlS4_EU_5N01f6zG5tHAA_Hw0wyL5X";
const HEADERS = {apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"};
const REST = SUPABASE_URL + "/rest/v1/watches";

const grid = document.getElementById("grid");
const msg = document.getElementById("msg");
const count = document.getElementById("count");
const checkBtn = document.getElementById("checkBtn");
const setMsg = (t) => { msg.textContent = t || ""; };

let checking = false;
let checkStartedAt = 0;

function fmt(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
function fmtDate(ts){ return new Date(ts).toLocaleString([], {month:"short", day:"numeric"}); }
function subLine(w){
  if(!w.last_checked) return "";
  if((w.status||"").toLowerCase() === "in stock") return "Available now";
  if(w.last_available_at) return "Last in stock · " + fmtDate(w.last_available_at);
  if(w.last_reserved_at)  return "Last in another cart · " + fmtDate(w.last_reserved_at);
  return "Not seen available yet";
}
function status(w){
  if(!w.last_checked) return {cls:"s-check", mark:'<span class="spin"></span>', text:"Checking…"};
  const s = (w.status||"").toLowerCase();
  if(s === "in stock")     return {cls:"s-in",  mark:'<span class="dot"></span>', text:"In stock"};
  if(s === "reserved")     return {cls:"s-res", mark:'<span class="dot"></span>', text:"In another cart"};
  if(s === "out of stock") return {cls:"s-out", mark:'<span class="dot"></span>', text:"Out of stock"};
  return {cls:"s-pending", mark:'<span class="dot"></span>', text:"Pending first check"};
}
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

async function load(){
  try{
    const r = await fetch(REST + "?select=*&order=created_at.desc", {headers:HEADERS});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const items = await r.json();
    render(items);
    return items;
  }catch(e){ setMsg("Couldn't load your list: "+e.message); return []; }
}

function render(items){
  count.textContent = items.length ? String(items.length).padStart(2,"0") : "00";
  if(!items.length){
    grid.innerHTML = '<div class="empty">No items yet — paste a link above to start watching.</div>';
    return;
  }
  grid.innerHTML = items.map(w => {
    const name = w.label || w.url.replace(/^https?:\/\/(www\.)?/,"");
    const st = status(w);
    const thumb = w.image_url
      ? `<img class="thumb" src="${esc(w.image_url)}" alt="" onerror="this.removeAttribute('src')">`
      : `<div class="thumb"></div>`;
    const sub = subLine(w);
    const checkedLine = !w.last_checked ? "Checking now…" : `Checked ${fmt(w.last_checked)}`;
    return `<div class="item">
      <button class="close" title="Stop watching" aria-label="Stop watching ${esc(name)}" onclick="removeItem(${w.id})">×</button>
      ${thumb}
      <div class="info">
        <div class="store">${esc(w.store || "—")}</div>
        <a class="name" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(name)}">${esc(name)}</a>
        <div class="meta">${checkedLine}</div>
      </div>
      <div class="status ${st.cls}">
        <div class="status-row">${st.mark}<span class="label">${st.text}</span></div>
        ${sub ? `<div class="substatus">${sub}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

async function removeItem(id){
  if(!confirm("Stop watching this item?")) return;
  try{
    const r = await fetch(REST + "?id=eq."+id, {method:"DELETE", headers:HEADERS});
    if(!r.ok) throw new Error("HTTP "+r.status);
    load();
  }catch(e){ setMsg("Couldn't remove: "+e.message); }
}

async function checkNow(){
  if(checking) return;
  try{
    const r = await fetch(REST + "?id=gt.0", {
      method:"PATCH", headers:{...HEADERS, Prefer:"return=minimal"},
      body: JSON.stringify({last_checked:null})
    });
    if(!r.ok){
      const t = await r.text();
      throw new Error(t.includes("policy") ? "the update policy isn't added yet" : "HTTP "+r.status);
    }
  }catch(e){ setMsg("Couldn't start a check: "+e.message); return; }

  checking = true; checkStartedAt = Date.now();
  checkBtn.disabled = true; checkBtn.textContent = "Checking…";
  setMsg("Asked your Mac to check everything now…");
  pollUntilDone();
}

async function pollUntilDone(){
  const items = await load();
  const pending = items.filter(w => !w.last_checked);
  const elapsed = Date.now() - checkStartedAt;

  if(pending.length === 0){
    finishChecking("All items checked");
  }else if(elapsed > 150000){
    finishChecking("Still working — your Mac may be asleep or busy. It'll finish on its own.");
  }else{
    setMsg(`Checking… ${items.length - pending.length}/${items.length} done`);
    setTimeout(pollUntilDone, 3000);
  }
}

function finishChecking(message){
  checking = false;
  checkBtn.disabled = false; checkBtn.textContent = "Check all now";
  setMsg(message);
  load();
}

document.getElementById("addForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const url = document.getElementById("url").value.trim();
  const label = document.getElementById("label").value.trim();
  if(!url) return;
  const btn = document.getElementById("addBtn");
  btn.disabled = true; setMsg("Adding…");
  const body = {url}; if(label) body.label = label;
  try{
    const r = await fetch(REST, {method:"POST", headers:{...HEADERS, Prefer:"return=representation"}, body:JSON.stringify(body)});
    if(!r.ok){ const t = await r.text(); throw new Error(t.includes("duplicate") ? "You're already watching that link." : "HTTP "+r.status); }
    document.getElementById("url").value = ""; document.getElementById("label").value = "";
    setMsg("Added — checking it now…");
    if(!checking){ checking = true; checkStartedAt = Date.now(); checkBtn.disabled = true; checkBtn.textContent = "Checking…"; pollUntilDone(); }
    else { load(); }
  }catch(e){ setMsg("Couldn't add: "+e.message); }
  finally{ btn.disabled = false; }
});

checkBtn.addEventListener("click", checkNow);
load();
setInterval(() => { if(!checking) load(); }, 60000);
</script>
</body>
</html>
